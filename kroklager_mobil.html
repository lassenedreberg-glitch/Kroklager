<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Kroklager</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--ok:#166534;--warn:#b45309;--danger:#b91c1c;--accent:#111827}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:10;background:#111827;color:white;padding:16px 18px}
header h1{margin:0;font-size:22px} header small{opacity:.8}
main{max-width:900px;margin:auto;padding:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px} .card{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:12px}
.metric b{font-size:24px;display:block} .metric span{color:var(--muted);font-size:13px}
.alert{padding:12px;border-radius:12px;margin-bottom:12px;font-weight:700} .ok{background:#dcfce7;color:#166534} .warn{background:#fef3c7;color:#92400e} .danger{background:#fee2e2;color:#991b1b}
nav{display:flex;gap:8px;overflow:auto;padding-bottom:8px} nav button{white-space:nowrap}
button,select,input{font:inherit} button{border:0;border-radius:10px;padding:11px 14px;background:#111827;color:white;font-weight:700} button.secondary{background:#e5e7eb;color:#111827} button.danger{background:#b91c1c}
select,input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:white;margin-top:5px;margin-bottom:10px}
label{font-size:13px;color:#374151;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px} th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left} th{position:sticky;top:0;background:white}
.tablewrap{overflow:auto;max-height:60vh} .hidden{display:none}
.rowbuttons{display:flex;gap:8px;flex-wrap:wrap} .rowbuttons button{flex:1;min-width:130px}
.small{font-size:12px;color:var(--muted)} .pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#eef2ff;font-size:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header><h1>🪝 Kroklager</h1><small>Garderobe + Lakkboks</small></header>
<main>
<div id="dashboard"></div>
<div class="card">
<nav>
<button onclick="showTab('stock')">Beholdning</button>
<button onclick="showTab('change')">Registrer kasse</button>
<button onclick="showTab('order')">Bestilling</button>
<button onclick="showTab('useup')">Bruk opp</button>
<button onclick="showTab('history')">Historikk</button>
</nav>
</div>

<section id="stock" class="tab card"></section>

<section id="change" class="tab card hidden">
<h2>Registrer kasse</h2>
<label>Vare<select id="itemSelect"></select></label>
<label>Lager<select id="locationSelect"><option>Garderobe</option><option>Lakkboks</option></select></label>
<div class="rowbuttons">
<button class="danger" onclick="changeQty(-1)">Åpnet / brukt 1</button>
<button onclick="changeQty(1)">Legg til 1</button>
</div>
<p class="small">Endringer lagres lokalt på denne telefonen/nettleseren.</p>
</section>

<section id="order" class="tab card hidden"></section>
<section id="useup" class="tab card hidden"></section>
<section id="history" class="tab card hidden"></section>

<div class="card">
<div class="rowbuttons">
<button class="secondary" onclick="exportData()">Eksporter sikkerhetskopi</button>
<button class="secondary" onclick="document.getElementById('importFile').click()">Importer sikkerhetskopi</button>
<input id="importFile" type="file" accept=".json" style="display:none" onchange="importData(event)">
</div>
<p class="small">Tips: ta en sikkerhetskopi av og til, spesielt før du bytter telefon.</p>
</div>
</main>

<script>
const INITIAL = [{"thickness": 1.5, "length": 400, "variant": "Standard", "item_no": "", "wardrobe": 0, "paintbox": 1}, {"thickness": 1.5, "length": 450, "variant": "Standard", "item_no": "", "wardrobe": 0, "paintbox": 1}, {"thickness": 2, "length": 75, "variant": "Standard", "item_no": "210833", "wardrobe": 0, "paintbox": 4}, {"thickness": 2, "length": 100, "variant": "Standard", "item_no": "", "wardrobe": 7, "paintbox": 1}, {"thickness": 2, "length": 150, "variant": "Standard", "item_no": "210839", "wardrobe": 0, "paintbox": 2}, {"thickness": 2, "length": 350, "variant": "Standard", "item_no": "215437", "wardrobe": 0, "paintbox": 1}, {"thickness": 2, "length": 350, "variant": "90°", "item_no": "210855", "wardrobe": 0, "paintbox": 1}, {"thickness": 2, "length": 400, "variant": "Standard", "item_no": "", "wardrobe": 0, "paintbox": 3}, {"thickness": 2, "length": 400, "variant": "90°", "item_no": "", "wardrobe": 6, "paintbox": 4}, {"thickness": 2, "length": 450, "variant": "Standard", "item_no": "", "wardrobe": 0, "paintbox": 4}, {"thickness": 2, "length": 450, "variant": "90°", "item_no": "", "wardrobe": 0, "paintbox": 4}, {"thickness": 2, "length": 500, "variant": "Standard", "item_no": "210845", "wardrobe": 0, "paintbox": 2}, {"thickness": 3, "length": 75, "variant": "Standard", "item_no": "210836", "wardrobe": 4, "paintbox": 0}, {"thickness": 3, "length": 100, "variant": "Standard", "item_no": "210837", "wardrobe": 6, "paintbox": 1}, {"thickness": 3, "length": 150, "variant": "90°", "item_no": "", "wardrobe": 0, "paintbox": 1}, {"thickness": 3, "length": 250, "variant": "Standard", "item_no": "", "wardrobe": 1, "paintbox": 1}, {"thickness": 3, "length": 350, "variant": "Standard", "item_no": "", "wardrobe": 3, "paintbox": 1}, {"thickness": 3, "length": 400, "variant": "Standard", "item_no": "210842", "wardrobe": 3, "paintbox": 0}, {"thickness": 3, "length": 400, "variant": "90°", "item_no": "215889", "wardrobe": 2, "paintbox": 0}, {"thickness": 3, "length": 450, "variant": "Standard", "item_no": "210844", "wardrobe": 4, "paintbox": 0}, {"thickness": 3, "length": 450, "variant": "90°", "item_no": "", "wardrobe": 2, "paintbox": 0}, {"thickness": 3, "length": 800, "variant": "90°", "item_no": "", "wardrobe": 0, "paintbox": 1}, {"thickness": 4, "length": 75, "variant": "Standard", "item_no": "253779", "wardrobe": 2, "paintbox": 2}, {"thickness": 4, "length": 100, "variant": "Standard", "item_no": "253780", "wardrobe": 5, "paintbox": 1}, {"thickness": 4, "length": 350, "variant": "Standard", "item_no": "", "wardrobe": 0, "paintbox": 1}, {"thickness": 4, "length": 400, "variant": "Standard", "item_no": "213358", "wardrobe": 1, "paintbox": 3}, {"thickness": 4, "length": 400, "variant": "90°", "item_no": "", "wardrobe": 0, "paintbox": 1}, {"thickness": 4, "length": 450, "variant": "Standard", "item_no": "213359", "wardrobe": 3, "paintbox": 0}, {"thickness": 4, "length": 500, "variant": "Standard", "item_no": "", "wardrobe": 0, "paintbox": 1}, {"thickness": 5, "length": 100, "variant": "Standard", "item_no": "212390", "wardrobe": 3, "paintbox": 0}, {"thickness": 5, "length": 150, "variant": "Standard", "item_no": "212391", "wardrobe": 0, "paintbox": 2}, {"thickness": 5, "length": 300, "variant": "Standard", "item_no": "210990", "wardrobe": 0, "paintbox": 2}, {"thickness": 5, "length": 400, "variant": "Standard", "item_no": "254697", "wardrobe": 4, "paintbox": 1}, {"thickness": 5, "length": 450, "variant": "Standard", "item_no": "266819", "wardrobe": 9, "paintbox": 0}, {"thickness": 6, "length": 150, "variant": "Standard", "item_no": "264307", "wardrobe": 0, "paintbox": 1}];
const KEY='kroklager_inventory_v1', HKEY='kroklager_history_v1';
let inventory = JSON.parse(localStorage.getItem(KEY) || 'null') || INITIAL;
let history = JSON.parse(localStorage.getItem(HKEY) || '[]');

function total(i){ return i.wardrobe + i.paintbox; }
function isCore(i){ return i.variant==='Standard' && [75,400,450].includes(i.length) && [2,3,4].includes(i.thickness); }
function save(){ localStorage.setItem(KEY,JSON.stringify(inventory)); localStorage.setItem(HKEY,JSON.stringify(history)); render(); }
function label(i){ return `${i.length}x${String(i.thickness).replace('.',',')} ${i.variant}${i.item_no?' • '+i.item_no:''}`; }
function showTab(id){ document.querySelectorAll('.tab').forEach(x=>x.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }

function render(){
  const tot=inventory.reduce((a,b)=>a+total(b),0), w=inventory.reduce((a,b)=>a+b.wardrobe,0), p=inventory.reduce((a,b)=>a+b.paintbox,0);
  const core=inventory.filter(isCore), low=Math.min(...core.map(total)), trigger=low<=1;
  document.getElementById('dashboard').innerHTML=`
    <div class="grid">
      <div class="card metric"><b>${tot}</b><span>Totalt kasser</span></div>
      <div class="card metric"><b>${w}</b><span>Garderobe</span></div>
      <div class="card metric"><b>${p}</b><span>Lakkboks</span></div>
      <div class="card metric"><b>${low}</b><span>Laveste standardvare</span></div>
    </div>
    <div class="alert ${trigger?'danger':'ok'}">${trigger?'BESTILL STANDARDKROKER – minst én variant er nede i 1 kasse.':'Ingen samlet standardbestilling nødvendig nå.'}</div>`;

  const sorted=[...inventory].sort((a,b)=>a.thickness-b.thickness||a.length-b.length||a.variant.localeCompare(b.variant));
  document.getElementById('stock').innerHTML=`<h2>Beholdning</h2><div class="tablewrap"><table><thead><tr><th>Tykk.</th><th>Lengde</th><th>Variant</th><th>Varenr.</th><th>Gard.</th><th>Lakk</th><th>Tot.</th></tr></thead><tbody>`+
  sorted.map(i=>`<tr><td>${String(i.thickness).replace('.',',')}</td><td>${i.length}</td><td>${i.variant}</td><td>${i.item_no||''}</td><td>${i.wardrobe}</td><td>${i.paintbox}</td><td><b>${total(i)}</b></td></tr>`).join('')+
  `</tbody></table></div>`;

  const sel=document.getElementById('itemSelect');
  sel.innerHTML=sorted.map(i=>`<option value="${inventory.indexOf(i)}">${label(i)} • totalt ${total(i)}</option>`).join('');

  const need=core.map(i=>({...i,need:Math.max(0,5-total(i))})).sort((a,b)=>a.thickness-b.thickness||a.length-b.length);
  const needTotal=need.reduce((a,b)=>a+b.need,0);
  const angle=inventory.filter(i=>i.variant==='90°').sort((a,b)=>a.thickness-b.thickness||a.length-b.length);
  document.getElementById('order').innerHTML=`
    <h2>Bestillingsregler</h2>
    <div class="alert ${trigger?'danger':'ok'}">${trigger?`Samlet standardbestilling er utløst. Kasser til målbeholdning 5: ${needTotal}.`:'Standard bestilles først når én standardvariant er nede i 1 kasse.'}</div>
    <h3>Standardkroker</h3>
    <div class="tablewrap"><table><tr><th>Vare</th><th>På lager</th><th>Mål</th><th>Til mål</th></tr>
    ${need.map(i=>`<tr><td>${label(i)}</td><td>${total(i)}</td><td>5</td><td>${i.need}</td></tr>`).join('')}</table></div>
    <h3>90°-kroker</h3>
    <div class="tablewrap"><table><tr><th>Vare</th><th>På lager</th><th>Minimum</th></tr>
    ${angle.map(i=>`<tr><td>${label(i)}</td><td>${total(i)}</td><td class="${total(i)<1?'danger':''}">1</td></tr>`).join('')}</table></div>`;

  const rest=inventory.filter(i=>i.variant==='Standard'&&!isCore(i)).sort((a,b)=>total(b)-total(a));
  document.getElementById('useup').innerHTML=`<h2>Bruk opp først</h2><p class="small">Ikke-standardvarer med størst beholdning øverst.</p><div class="tablewrap"><table><tr><th>Vare</th><th>Totalt</th></tr>${rest.map(i=>`<tr><td>${label(i)}</td><td><b>${total(i)}</b></td></tr>`).join('')}</table></div>`;

  document.getElementById('history').innerHTML=`<h2>Historikk</h2>${history.length?'<div class="tablewrap"><table><tr><th>Tid</th><th>Vare</th><th>Lager</th><th>Endring</th></tr>'+history.slice().reverse().map(h=>`<tr><td>${h.time}</td><td>${h.item}</td><td>${h.location}</td><td>${h.delta>0?'+':''}${h.delta}</td></tr>`).join('')+'</table></div>':'<p>Ingen endringer registrert i appen ennå.</p>'}`;
}

function changeQty(delta){
  const idx=Number(document.getElementById('itemSelect').value), loc=document.getElementById('locationSelect').value;
  const field=loc==='Garderobe'?'wardrobe':'paintbox';
  if(inventory[idx][field]+delta<0){ alert('Kan ikke gå under 0 kasser.'); return; }
  inventory[idx][field]+=delta;
  history.push({time:new Date().toLocaleString('no-NO'),item:label(inventory[idx]),location:loc,delta});
  save();
  alert(delta<0?'1 kasse er trukket fra.':'1 kasse er lagt til.');
}

function exportData(){
  const blob=new Blob([JSON.stringify({inventory,history},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='kroklager-backup.json'; a.click(); URL.revokeObjectURL(a.href);
}
function importData(e){
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); inventory=d.inventory||INITIAL; history=d.history||[]; save(); alert('Sikkerhetskopi importert.'); }catch{alert('Kunne ikke lese filen.')} }; r.readAsText(f);
}
render();
</script>
</body>
</html>
