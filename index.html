<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>Kroker</title>
<!-- Kroklager v5: standard-only ordering with +/- -->
<style>
*{box-sizing:border-box}
body{margin:0;background:#07111f;color:#eef3f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:18px 18px 10px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#07111f;z-index:5}
h1{font-size:28px;margin:0}.plus{width:44px;height:44px;border-radius:50%;border:0;background:#1769e0;color:#fff;font-size:30px}
.wrap{padding:0 14px 92px}.screen{display:none}.screen.active{display:block}
.alert{background:#4b1016;border:1px solid #d83c49;border-radius:12px;padding:13px 14px;margin:6px 0 14px;color:#fff}
.alert b{display:block;color:#ff5c67}.alert button{width:100%;background:none;border:0;color:inherit;text-align:left;padding:0;font:inherit}
.section-title{font-size:14px;color:#9da9b7;font-weight:800;margin:16px 8px 7px;text-transform:uppercase}
.card{background:#101c29;border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:82px 1fr 78px 22px;gap:8px;align-items:center;padding:12px;border-bottom:1px solid #22303d;min-height:52px}
.row:last-child{border-bottom:0}.dim{font-weight:800}.len{color:#e8edf3}.qty{text-align:center;background:#1b2836;border-radius:8px;padding:7px 4px;font-weight:700}
.chev{color:#b8c1cb;font-size:24px}.groupbreak{height:10px;background:#07111f;border-top:1px solid #43515f;border-bottom:1px solid #22303d}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#0b1623;border-top:1px solid #263646;display:flex;justify-content:space-around;padding:9px 4px calc(9px + env(safe-area-inset-bottom));font-size:11px;z-index:10}
.bottom button{background:none;border:0;color:#9ba7b4;text-align:center;font-size:11px}.bottom button.on{color:#4c91ff}
.panel{background:#101c29;border-radius:12px;padding:14px;margin-top:12px}.panel h2{margin:0 0 12px}
.detail{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:20}
.sheet{width:100%;background:#111d2b;border-radius:18px 18px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto}
.sheet h2{margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{background:#0a1521;border:1px solid #26384b;border-radius:10px;padding:10px}.box label{display:block;color:#9eabba;font-size:12px;margin-bottom:5px}
.box input,.box select{width:100%;background:#111d2b;color:#fff;border:1px solid #33475c;border-radius:8px;padding:9px;font-size:16px}
.wide{grid-column:1/-1}.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.actions button{flex:1;border:0;border-radius:10px;padding:12px;font-weight:700}
.save{background:#1769e0;color:white}.archivebtn{background:#283747;color:#fff}.danger{background:#5a2025;color:#fff}.restore{background:#175f3d;color:#fff}
.empty{padding:18px;color:#9aa7b5;text-align:center}.muted{color:#9aa7b5;font-size:12px}
.orderitem{padding:12px 0;border-bottom:1px solid #263646}.orderitem:last-child{border:0}
.ordergrid{display:grid;grid-template-columns:1fr auto;gap:6px}.ordername{font-weight:800}.ordernum{color:#4c91ff;font-weight:800}
.mailbtn{width:100%;border:0;border-radius:10px;padding:13px;background:#1769e0;color:#fff;font-weight:800;margin-top:14px}
.historyitem{padding:10px 0;border-bottom:1px solid #263646}.historyitem:last-child{border:0}
.settingrow{padding:10px 0}.settingrow label{display:block;font-size:12px;color:#9aa7b5;margin-bottom:4px}.settingrow input{width:100%;padding:10px;border-radius:8px;border:1px solid #33475c;background:#0a1521;color:#fff;font-size:16px}
.orderrow{padding:12px 0;border-bottom:1px solid #263646}.orderrow:last-child{border-bottom:0}
.orderline{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.ordercontrols{display:flex;align-items:center;gap:8px}
.ordercontrols button{width:40px;height:40px;border:0;border-radius:10px;background:#1b2b3d;color:#fff;font-size:24px;font-weight:800}
.ordercontrols .count{min-width:38px;text-align:center;font-weight:800;font-size:18px}
.ordergroupbreak{height:10px;border-top:1px solid #43515f;margin:2px 0 0}

</style>
</head>
<body>
<header><h1>Kroker</h1><button class="plus" id="addBtn">+</button></header>

<div class="wrap">
  <section id="lager" class="screen active">
    <div id="minAlert"></div>
    <div id="list"></div>
  </section>

  <section id="arkiv" class="screen">
    <div class="section-title">Arkiv</div>
    <div id="archivelist" class="card"></div>
  </section>

  <section id="bestilling" class="screen">
    <div class="panel">
      <h2>Bestilling</h2>
      <div class="muted">Kun standardkroker. Forslaget fyller hver type opp til MAKS. Juster med − / + før sending.</div>
      <div id="orderlist"></div>
      <button class="mailbtn" id="mailBtn">Send bestilling på e-post</button>
    </div>
  </section>

  <section id="historikk" class="screen">
    <div class="panel"><h2>Historikk</h2><div id="historylist"></div></div>
  </section>

  <section id="innstillinger" class="screen">
    <div class="panel">
      <h2>Innstillinger</h2>
      <div class="settingrow"><label>E-post mottaker</label><input id="recipient"></div>
      <div class="settingrow"><label>Standard emne</label><input id="subject"></div>
      <button class="mailbtn" id="saveSettings">Lagre innstillinger</button>
    </div>
  </section>
</div>

<div class="bottom">
  <button class="on" data-screen="lager">▦<br>Lager</button>
  <button data-screen="arkiv">▣<br>Arkiv</button>
  <button data-screen="bestilling">🛒<br>Bestilling</button>
  <button data-screen="historikk">◷<br>Historikk</button>
  <button data-screen="innstillinger">⚙<br>Innstillinger</button>
</div>

<div id="detail" class="detail">
  <div class="sheet">
    <h2 id="sheetTitle"></h2>
    <div class="grid">
      <div class="box"><label>Totalt</label><strong id="sheetTotal"></strong></div>
      <div class="box"><label>Varenr.</label><input id="no"></div>
      <div class="box"><label>Minimum</label><input id="min" type="number" min="0"></div>
      <div class="box"><label>Maksimum</label><input id="max" type="number" min="0"></div>
      <div class="box"><label>Garderobe</label><input id="g" type="number" min="0"></div>
      <div class="box"><label>Lakkboks</label><input id="lb" type="number" min="0"></div>
      <div class="box"><label>Håkon</label><input id="h" type="number" min="0"></div>
      <div class="box"><label>Kroker per kasse</label><input id="perbox" type="number" min="0"></div>
    </div>
    <div class="actions">
      <button class="save" id="saveDetail">Lagre</button>
      <button class="archivebtn" id="archiveCurrent">Arkiver</button>
    </div>
  </div>
</div>

<div id="newtype" class="detail">
  <div class="sheet">
    <h2>Legg til ny type</h2>
    <div class="grid">
      <div class="box"><label>Tykkelse mm</label><input id="nt" type="number" step="0.5" min="0.5"></div>
      <div class="box"><label>Lengde mm</label><input id="nl" type="number" min="1"></div>
      <div class="box"><label>Variant</label><select id="nv"><option>Standard</option><option>90°</option></select></div>
      <div class="box"><label>Varenr.</label><input id="nno"></div>
      <div class="box"><label>Minimum</label><input id="nmin" type="number" min="0"></div>
      <div class="box"><label>Maksimum</label><input id="nmax" type="number" min="0"></div>
      <div class="box"><label>Kroker per kasse</label><input id="nperbox" type="number" min="0"></div>
      <div class="box"><label>Garderobe</label><input id="ng" type="number" min="0" value="0"></div>
      <div class="box"><label>Lakkboks</label><input id="nlb" type="number" min="0" value="0"></div>
      <div class="box wide"><label>Håkon</label><input id="nh" type="number" min="0" value="0"></div>
    </div>
    <div class="actions"><button class="save" id="addType">Legg til</button></div>
  </div>
</div>

<script>
const INITIAL=[{"t": 2, "l": 400, "v": "Standard", "no": "", "g": 0, "lb": 3, "h": 0, "cat": "standard", "min": 1, "max": 5, "perbox": null}, {"t": 2, "l": 75, "v": "Standard", "no": "210833", "g": 0, "lb": 4, "h": 0, "cat": "standard", "min": 1, "max": 5, "perbox": null}, {"t": 2, "l": 450, "v": "Standard", "no": "", "g": 0, "lb": 4, "h": 0, "cat": "standard", "min": 1, "max": 5, "perbox": null}, {"t": 3, "l": 400, "v": "Standard", "no": "210842", "g": 3, "lb": 0, "h": 0, "cat": "standard", "min": 1, "max": 5, "perbox": null}, {"t": 3, "l": 75, "v": "Standard", "no": "210836", "g": 4, "lb": 0, "h": 0, "cat": "standard", "min": 1, "max": 5, "perbox": null}, {"t": 3, "l": 450, "v": "Standard", "no": "210844", "g": 4, "lb": 0, "h": 0, "cat": "standard", "min": 1, "max": 5, "perbox": null}, {"t": 4, "l": 400, "v": "Standard", "no": "213358", "g": 1, "lb": 3, "h": 0, "cat": "standard", "min": 1, "max": 5, "perbox": null}, {"t": 4, "l": 75, "v": "Standard", "no": "253779", "g": 2, "lb": 2, "h": 0, "cat": "standard", "min": 1, "max": 5, "perbox": null}, {"t": 4, "l": 450, "v": "Standard", "no": "213359", "g": 3, "lb": 0, "h": 0, "cat": "standard", "min": 1, "max": 5, "perbox": null}, {"t": 2, "l": 350, "v": "90°", "no": "210855", "g": 0, "lb": 1, "h": 0, "cat": "90", "min": 1, "max": 1, "perbox": null}, {"t": 2, "l": 400, "v": "90°", "no": "", "g": 6, "lb": 4, "h": 0, "cat": "90", "min": 1, "max": 1, "perbox": null}, {"t": 2, "l": 450, "v": "90°", "no": "", "g": 0, "lb": 4, "h": 0, "cat": "90", "min": 1, "max": 1, "perbox": null}, {"t": 3, "l": 150, "v": "90°", "no": "", "g": 0, "lb": 1, "h": 0, "cat": "90", "min": 1, "max": 1, "perbox": null}, {"t": 3, "l": 400, "v": "90°", "no": "215889", "g": 2, "lb": 0, "h": 0, "cat": "90", "min": 1, "max": 1, "perbox": null}, {"t": 3, "l": 450, "v": "90°", "no": "", "g": 2, "lb": 0, "h": 0, "cat": "90", "min": 1, "max": 1, "perbox": null}, {"t": 3, "l": 800, "v": "90°", "no": "", "g": 0, "lb": 1, "h": 0, "cat": "90", "min": 1, "max": 1, "perbox": null}, {"t": 4, "l": 400, "v": "90°", "no": "", "g": 0, "lb": 1, "h": 0, "cat": "90", "min": 1, "max": 1, "perbox": null}, {"t": 2, "l": 100, "v": "Standard", "no": "", "g": 7, "lb": 1, "h": 0, "cat": "100", "min": null, "max": null, "perbox": null}, {"t": 3, "l": 100, "v": "Standard", "no": "210837", "g": 6, "lb": 1, "h": 0, "cat": "100", "min": null, "max": null, "perbox": null}, {"t": 4, "l": 100, "v": "Standard", "no": "253780", "g": 5, "lb": 1, "h": 0, "cat": "100", "min": null, "max": null, "perbox": null}, {"t": 5, "l": 100, "v": "Standard", "no": "212390", "g": 3, "lb": 0, "h": 0, "cat": "100", "min": null, "max": null, "perbox": null}, {"t": 1.5, "l": 400, "v": "Standard", "no": "", "g": 0, "lb": 1, "h": 0, "cat": "other", "min": null, "max": null, "perbox": null}, {"t": 1.5, "l": 450, "v": "Standard", "no": "", "g": 0, "lb": 1, "h": 0, "cat": "other", "min": null, "max": null, "perbox": null}, {"t": 2, "l": 150, "v": "Standard", "no": "210839", "g": 0, "lb": 2, "h": 0, "cat": "other", "min": null, "max": null, "perbox": null}, {"t": 2, "l": 350, "v": "Standard", "no": "215437", "g": 0, "lb": 1, "h": 0, "cat": "other", "min": null, "max": null, "perbox": null}, {"t": 2, "l": 500, "v": "Standard", "no": "210845", "g": 0, "lb": 2, "h": 0, "cat": "other", "min": null, "max": null, "perbox": null}, {"t": 3, "l": 250, "v": "Standard", "no": "", "g": 1, "lb": 1, "h": 0, "cat": "other", "min": null, "max": null, "perbox": null}, {"t": 3, "l": 350, "v": "Standard", "no": "", "g": 3, "lb": 1, "h": 0, "cat": "other", "min": null, "max": null, "perbox": null}, {"t": 4, "l": 350, "v": "Standard", "no": "", "g": 0, "lb": 1, "h": 0, "cat": "other", "min": null, "max": null, "perbox": null}, {"t": 4, "l": 500, "v": "Standard", "no": "", "g": 0, "lb": 1, "h": 0, "cat": "other", "min": null, "max": null, "perbox": null}, {"t": 5, "l": 150, "v": "Standard", "no": "212391", "g": 0, "lb": 2, "h": 0, "cat": "other", "min": null, "max": null, "perbox": null}, {"t": 5, "l": 300, "v": "Standard", "no": "210990", "g": 0, "lb": 2, "h": 0, "cat": "other", "min": null, "max": null, "perbox": null}, {"t": 5, "l": 400, "v": "Standard", "no": "254697", "g": 4, "lb": 1, "h": 0, "cat": "other", "min": null, "max": null, "perbox": null}, {"t": 5, "l": 450, "v": "Standard", "no": "266819", "g": 9, "lb": 0, "h": 0, "cat": "other", "min": null, "max": null, "perbox": null}, {"t": 6, "l": 150, "v": "Standard", "no": "264307", "g": 0, "lb": 1, "h": 0, "cat": "other", "min": null, "max": null, "perbox": null}];
let data=JSON.parse(localStorage.getItem('kroker_v4')||'null')||INITIAL;
let archived=JSON.parse(localStorage.getItem('kroker_archive_v4')||'[]');
let history=JSON.parse(localStorage.getItem('kroker_history_v4')||'[]');
let settings=JSON.parse(localStorage.getItem('kroker_settings_v4')||'null')||{recipient:'Lasse.nedreberg@nomek.as',subject:'Bestilling kroker'};
let current=null;
let orderDraft={};

const total=x=>(+x.g||0)+(+x.lb||0)+(+x.h||0);
const fmt=x=>String(x).replace('.',',');

function log(msg){history.unshift({ts:new Date().toLocaleString('no-NO'),msg});history=history.slice(0,300)}
function persist(){localStorage.setItem('kroker_v4',JSON.stringify(data));localStorage.setItem('kroker_archive_v4',JSON.stringify(archived));localStorage.setItem('kroker_history_v4',JSON.stringify(history));localStorage.setItem('kroker_settings_v4',JSON.stringify(settings));render()}

function row(x,i){
  return `<div class="row" data-index="${i}">
    <div class="dim">${fmt(x.t)} mm</div>
    <div class="len">${x.l} mm${x.v==='90°'?' · 90°':''}</div>
    <div class="qty">${total(x)} ${total(x)===1?'kasse':'kasser'}</div>
    <div class="chev">›</div>
  </div>`;
}
function section(title,arr,grouped=false){
  if(!arr.length)return'';
  let s=`<div class="section-title">${title}</div><div class="card">`;
  let last=null;
  arr.forEach(x=>{
    const i=data.indexOf(x);
    if(grouped && last!==null && x.t!==last) s+=`<div class="groupbreak"></div>`;
    s+=row(x,i); last=x.t;
  });
  return s+'</div>';
}

function archiveZeros(){
  const zeros=data.filter(x=>total(x)<=0);
  if(!zeros.length)return;
  zeros.forEach(x=>{archived.push({...x,archivedAt:new Date().toISOString()});log(`${fmt(x.t)} mm · ${x.l} mm${x.v==='90°'?' · 90°':''} arkivert automatisk ved 0 kasser`)});
  data=data.filter(x=>total(x)>0);
}

function orderState(){
  const standard=data.filter(x=>total(x)>0 && x.cat==='standard');
  const triggerItem=standard.find(x=>
    x.max!==0 &&
    x.min!==null && x.min!=='' &&
    x.max!==null && x.max!=='' &&
    total(x)<=+x.min
  );

  const suggestions=triggerItem
    ? standard
        .filter(x=>x.max!==0 && x.max!==null && x.max!=='' && total(x)<+x.max)
        .map(x=>({...x,order:+x.max-total(x)}))
    : [];

  return {triggerItem,suggestions};
}

function render(){
  archiveZeros();

  const active=data.filter(x=>total(x)>0);
  const std=active.filter(x=>x.cat==='standard').sort((a,b)=>a.t-b.t || [400,75,450].indexOf(a.l)-[400,75,450].indexOf(b.l));
  const deg=active.filter(x=>x.cat==='90').sort((a,b)=>a.t-b.t || a.l-b.l);
  const hundred=active.filter(x=>x.cat==='100').sort((a,b)=>a.t-b.t);
  const other=active.filter(x=>x.cat==='other').sort((a,b)=>a.t-b.t || a.l-b.l);

  document.getElementById('list').innerHTML=
    section('Standardkroker',std,true)+section('90° kroker',deg,true)+section('100 mm kroker',hundred,true)+section('Øvrige kroker',other,true);

  document.querySelectorAll('#list .row').forEach(el=>el.addEventListener('click',()=>openItem(+el.dataset.index)));

  const {triggerItem,suggestions}=orderState();
  document.getElementById('minAlert').innerHTML=triggerItem ? `<div class="alert"><button id="alertBtn"><b>MINIMUM NÅDD — ${triggerItem.l} × ${fmt(triggerItem.t)} mm${triggerItem.v==='90°'?' · 90°':''}</b>${total(triggerItem)} ${total(triggerItem)===1?'kasse':'kasser'} igjen (Min = ${triggerItem.min})</button></div>` : '';
  if(triggerItem) document.getElementById('alertBtn').addEventListener('click',()=>showScreen('bestilling'));

  const al=document.getElementById('archivelist');
  al.innerHTML=archived.length?archived.map((x,i)=>`<div class="row" data-arch="${i}"><div class="dim">${fmt(x.t)} mm</div><div class="len">${x.l} mm${x.v==='90°'?' · 90°':''}</div><div class="qty">${total(x)} kasser</div><div class="chev">›</div></div>`).join(''):'<div class="empty">Arkivet er tomt.</div>';
  document.querySelectorAll('#archivelist .row').forEach(el=>el.addEventListener('click',()=>openArchived(+el.dataset.arch)));

  const ol=document.getElementById('orderlist');
  if(!triggerItem){
    orderDraft={};
    ol.innerHTML='<div class="empty">Ingen bestillingsrunde er utløst.</div>';
  } else {
    const standardAll=data
      .filter(x=>total(x)>0 && x.cat==='standard')
      .sort((a,b)=>a.t-b.t || [400,75,450].indexOf(a.l)-[400,75,450].indexOf(b.l));

    // Initialize only when a row is new in this order round.
    standardAll.forEach(x=>{
      const key=`${x.t}|${x.l}|${x.v}`;
      if(!(key in orderDraft)){
        orderDraft[key]=(x.max!==0 && x.max!==null && x.max!=='' && total(x)<+x.max)
          ? Math.max(0,+x.max-total(x))
          : 0;
      }
    });

    let lastT=null;
    let out='';
    standardAll.forEach(x=>{
      const key=`${x.t}|${x.l}|${x.v}`;
      if(lastT!==null && x.t!==lastT) out+='<div class="ordergroupbreak"></div>';
      const qty=orderDraft[key]||0;
      const hooks=(x.perbox||0)*qty;
      out+=`<div class="orderrow">
        <div class="orderline">
          <div>
            <div class="ordername">${fmt(x.t)} mm · ${x.l} mm</div>
            <div class="muted">På lager ${total(x)} · Maks ${x.max??'—'}${x.perbox?` · ${x.perbox} kroker/kasse${qty?` · ${hooks} kroker`:''}`:''}${x.no?` · Varenr. ${x.no}`:''}</div>
          </div>
          <div class="ordercontrols">
            <button type="button" class="minus" data-key="${key}">−</button>
            <div class="count">${qty}</div>
            <button type="button" class="plusline" data-key="${key}">+</button>
          </div>
        </div>
      </div>`;
      lastT=x.t;
    });
    ol.innerHTML=out;

    ol.querySelectorAll('.minus').forEach(btn=>btn.addEventListener('click',()=>{
      const k=btn.dataset.key;
      orderDraft[k]=Math.max(0,(orderDraft[k]||0)-1);
      render();
    }));
    ol.querySelectorAll('.plusline').forEach(btn=>btn.addEventListener('click',()=>{
      const k=btn.dataset.key;
      orderDraft[k]=(orderDraft[k]||0)+1;
      render();
    }));
  }

  document.getElementById('historylist').innerHTML=history.length?history.map(h=>`<div class="historyitem"><b>${h.msg}</b><div class="muted">${h.ts}</div></div>`).join(''):'<div class="empty">Ingen historikk ennå.</div>';

  document.getElementById('recipient').value=settings.recipient;
  document.getElementById('subject').value=settings.subject;
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('on',b.dataset.screen===id));
}
document.querySelectorAll('.bottom button').forEach(b=>b.addEventListener('click',()=>showScreen(b.dataset.screen)));

function openItem(i){
  current={type:'active',i};
  const x=data[i];
  document.getElementById('sheetTitle').textContent=`${fmt(x.t)} mm · ${x.l} mm${x.v==='90°'?' · 90°':''}`;
  document.getElementById('sheetTotal').textContent=total(x)+' kasser';
  document.getElementById('no').value=x.no||'';
  document.getElementById('min').value=x.min??'';
  document.getElementById('max').value=x.max??'';
  document.getElementById('g').value=x.g||0;document.getElementById('lb').value=x.lb||0;document.getElementById('h').value=x.h||0;
  document.getElementById('perbox').value=x.perbox??'';
  document.querySelector('#detail .actions').innerHTML='<button class="save" id="saveDetail2">Lagre</button><button class="archivebtn" id="archiveCurrent2">Arkiver</button>';
  document.getElementById('saveDetail2').addEventListener('click',saveDetail);
  document.getElementById('archiveCurrent2').addEventListener('click',archiveCurrent);
  document.getElementById('detail').style.display='flex';
}
function openArchived(i){
  current={type:'archive',i};const x=archived[i];
  document.getElementById('sheetTitle').textContent=`ARKIV · ${fmt(x.t)} mm · ${x.l} mm${x.v==='90°'?' · 90°':''}`;
  document.getElementById('sheetTotal').textContent=total(x)+' kasser';
  document.getElementById('no').value=x.no||'';document.getElementById('min').value=x.min??'';document.getElementById('max').value=x.max??'';
  document.getElementById('g').value=x.g||0;document.getElementById('lb').value=x.lb||0;document.getElementById('h').value=x.h||0;document.getElementById('perbox').value=x.perbox??'';
  document.querySelector('#detail .actions').innerHTML='<button class="restore" id="restoreBtn">Gjenopprett</button><button class="danger" id="deleteBtn">Slett permanent</button>';
  document.getElementById('restoreBtn').addEventListener('click',restoreCurrent);document.getElementById('deleteBtn').addEventListener('click',deleteForever);
  document.getElementById('detail').style.display='flex';
}
document.getElementById('detail').addEventListener('click',e=>{if(e.target===e.currentTarget){e.currentTarget.style.display='none';current=null}});

function saveDetail(){
  if(!current||current.type!=='active')return;
  const x=data[current.i], before=total(x);
  x.no=document.getElementById('no').value.trim();
  x.min=document.getElementById('min').value===''?null:+document.getElementById('min').value;
  x.max=document.getElementById('max').value===''?null:+document.getElementById('max').value;
  if(x.max===0) x.min=0;
  x.g=+document.getElementById('g').value||0;x.lb=+document.getElementById('lb').value||0;x.h=+document.getElementById('h').value||0;
  x.perbox=document.getElementById('perbox').value===''?null:+document.getElementById('perbox').value;
  log(`${fmt(x.t)} mm · ${x.l} mm${x.v==='90°'?' · 90°':''} oppdatert: ${before} → ${total(x)} kasser`);
  document.getElementById('detail').style.display='none';current=null;persist();
}
function archiveCurrent(){
  if(!current||current.type!=='active')return;
  const x=data[current.i];archived.push({...x,archivedAt:new Date().toISOString()});data.splice(current.i,1);
  log(`${fmt(x.t)} mm · ${x.l} mm${x.v==='90°'?' · 90°':''} arkivert`);
  document.getElementById('detail').style.display='none';current=null;persist();
}
function restoreCurrent(){
  const x={...archived[current.i]};delete x.archivedAt;data.push(x);archived.splice(current.i,1);log(`${fmt(x.t)} mm · ${x.l} mm gjenopprettet fra arkiv`);
  document.getElementById('detail').style.display='none';current=null;persist();
}
function deleteForever(){
  if(!confirm('Slette denne typen permanent fra arkivet?'))return;
  const x=archived[current.i];archived.splice(current.i,1);log(`${fmt(x.t)} mm · ${x.l} mm slettet permanent fra arkiv`);
  document.getElementById('detail').style.display='none';current=null;persist();
}

document.getElementById('addBtn').addEventListener('click',()=>document.getElementById('newtype').style.display='flex');
document.getElementById('newtype').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.style.display='none'});
document.getElementById('addType').addEventListener('click',()=>{
  const t=+document.getElementById('nt').value,l=+document.getElementById('nl').value,v=document.getElementById('nv').value;
  if(!t||!l){alert('Fyll inn tykkelse og lengde.');return}
  let cat='other';if(v==='90°')cat='90';else if(l===100)cat='100';else if([2,3,4].includes(t)&&[75,400,450].includes(l))cat='standard';
  const newMax=document.getElementById('nmax').value===''?null:+document.getElementById('nmax').value;
  const newMin=newMax===0?0:(document.getElementById('nmin').value===''?null:+document.getElementById('nmin').value);
  const x={t,l,v,no:document.getElementById('nno').value.trim(),min:newMin,max:newMax,perbox:document.getElementById('nperbox').value===''?null:+document.getElementById('nperbox').value,g:+document.getElementById('ng').value||0,lb:+document.getElementById('nlb').value||0,h:+document.getElementById('nh').value||0,cat};
  data.push(x);log(`${fmt(t)} mm · ${l} mm${v==='90°'?' · 90°':''} lagt til`);
  document.getElementById('newtype').style.display='none';persist();
});

document.getElementById('max').addEventListener('input',e=>{
  if(e.target.value==='0') document.getElementById('min').value='0';
});
document.getElementById('nmax').addEventListener('input',e=>{
  if(e.target.value==='0') document.getElementById('nmin').value='0';
});

document.getElementById('saveSettings').addEventListener('click',()=>{
  settings.recipient=document.getElementById('recipient').value.trim()||'Lasse.nedreberg@nomek.as';
  settings.subject=document.getElementById('subject').value.trim()||'Bestilling kroker';
  log('Innstillinger for e-post oppdatert');persist();alert('Lagret');
});

document.getElementById('mailBtn').addEventListener('click',()=>{
  const {triggerItem}=orderState();
  if(!triggerItem){alert('Ingen bestillingsrunde er utløst.');return}

  const rows=data
    .filter(x=>total(x)>0 && x.cat==='standard')
    .sort((a,b)=>a.t-b.t || [400,75,450].indexOf(a.l)-[400,75,450].indexOf(b.l))
    .map(x=>{
      const key=`${x.t}|${x.l}|${x.v}`;
      return {x,qty:orderDraft[key]||0};
    })
    .filter(r=>r.qty>0);

  if(!rows.length){alert('Bestillingen inneholder 0 kasser.');return}

  let body='Hei,\n\nBestilling kroker:\n\n';
  rows.forEach(({x,qty})=>{
    const hooks=(x.perbox||0)*qty;
    body+=`${fmt(x.t)} mm x ${x.l} mm`;
    if(x.no) body+=` | varenr. ${x.no}`;
    body+=` | ${qty} kasser`;
    if(x.perbox) body+=` | ${x.perbox} kroker/kasse | ${hooks} kroker totalt`;
    body+='\n';
  });
  body+='\nVennlig hilsen';

  window.location.href=
    `mailto:${encodeURIComponent(settings.recipient)}?subject=${encodeURIComponent(settings.subject)}&body=${encodeURIComponent(body)}`;
});

render();
</script>
</body>
</html>
